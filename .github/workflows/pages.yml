name: Publish SIL860 viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble website
        run: |
          mkdir -p _site
          for archive in assets*.zip; do unzip -qo "$archive" -d _site; done
          cat update-v5.part* > /tmp/update-v5.zip
          unzip -qo /tmp/update-v5.zip -d _site
          for archive in update-v6*.zip; do unzip -qo "$archive" -d _site; done
          for archive in update-v7*.zip; do unzip -qo "$archive" -d _site; done
          unzip -qo update-v8.zip -d _site
          cp index.html main.js style.css favicon.svg CREDITS.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
